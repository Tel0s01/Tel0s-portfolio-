<!doctype html>
<html>
  <head>
    <title>Photography | Tel0s</title>
     <link rel="icon" type="image/png" href="favicon.png">
    <style>
      @font-face {
        font-family: "Host Grotesk";
        src: url("HostGrotesk-VariableFont_wght.ttf") format("truetype-variations");
        font-weight: 100 900;
      }
.photo-grid img {
  cursor: zoom-in;
}

.lightbox {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.92);
  justify-content: center;
  align-items: center;
  z-index: 100;
  cursor: zoom-out;
}

.lightbox.open {
  display: flex;
}

.lightbox img {
  max-width: 90vw;
  max-height: 90vh;
  width: auto;
  height: auto;
  object-fit: contain;
}
      body {
        background-color: #000000;
        color: #ffffff;
        font-family: "Host Grotesk", sans-serif;
        margin: 0;
        padding: 60px 40px;
      }

      a {
        color: #ffffff;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 40px;
      }

      .navbar .nav-links {
        display: flex;
        align-items: center;
        gap: 24px;
      }

      .navbar .nav-links a {
        font-size: 14px;
      }

      .photo-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 40px;
        margin-top: 100px;
        margin-bottom: 100px;
      }

      .photo-grid img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-links">
        <a href="index.html" class="logo"><img src="LOGOMARK.jpg" alt="Tel0s" style="height: 50px"></a>
        <a href="design.html">Design</a>
        <a href="photography.html">Photography</a>
        <a href="archive.html">Archive</a>
      </div>
    </nav>

    <h1>Photography</h1>

    <div class="photo-grid">
      <img src="photo1.jpg" alt="Photo one">
      <img src="photo2.jpg" alt="Photo two">
      <img src="photo3.jpg" alt="Photo three">
      <img src="photo4.jpg" alt="Photo four">
      <img src="photo5.jpg" alt="Photo five">
      <img src="photo6.jpg" alt="Photo six">
    </div>
    <div class="lightbox" id="lightbox">
  <img id="lightbox-img" src="" alt="">
</div>
<script>
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');

  document.querySelectorAll('.photo-grid img').forEach(img => {
    img.addEventListener('click', () => {
      lightboxImg.src = img.src;
      lightboxImg.alt = img.alt;
      lightbox.classList.add('open');
    });
  });

  lightbox.addEventListener('click', () => {
    lightbox.classList.remove('open');
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      lightbox.classList.remove('open');
    }
  });
</script>
  </body>
</html>

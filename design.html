<!doctype html>
<html>
  <head>
    <title>Design | Tel0s</title>
     <link rel="icon" type="image/png" href="favicon.png">
    <style>
      @font-face {
        font-family: "Host Grotesk";
        src: url("HostGrotesk-VariableFont_wght.ttf") format("truetype-variations");
        font-weight: 100 900;
      }
.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 40px;
}

.navbar .nav-links {
  display: flex;
  align-items: center;
  gap: 24px;
}

.navbar .nav-links a {
  font-size: 14px;
}
      body {
        background-color: #030303;
        color: #ffffff;
        font-family: "Host Grotesk", sans-serif;
        margin: 0;
        padding: 60px 40px;
        font-size: 16px;
      }

      a {
        color: #ffffff;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      .work-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 150px 10px;
        margin-top: 60px;
        margin-bottom: 60px;
      }

      .work-item {
        display: flex;
        flex-direction: column;
        cursor: pointer;
      }

      .work-image {
        max-width: 500px;
        width: 100%;
        display: block;
      }

      .work-item p {
        margin-top: 10px;
      }

      @keyframes glitch {
        0%   { transform: translate(0, 0); filter: none; }
        10%  { transform: translate(-8px, 4px); filter: hue-rotate(90deg) contrast(1.3); }
        20%  { transform: translate(8px, -4px); filter: invert(0.15); }
        30%  { transform: translate(-6px, 0); filter: contrast(1.5) saturate(2); }
        40%  { transform: translate(6px, 2px); filter: hue-rotate(-90deg); }
        50%  { transform: translate(0, -4px); filter: none; }
        60%  { transform: translate(-5px, 0); filter: invert(0.1); }
        100% { transform: translate(0, 0); filter: none; }
      }

      .work-image.glitching {
        animation: glitch 0.6s ease-in-out;
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
 
  <div class="nav-links">
   <a href="index.html" class="logo"><img src="LOGOMARK.jpg" alt="Tel0s" style="height: 50px;"></a>
    <a href="design.html">Design</a>
    <a href="photography.html">Photography</a>
    <a href="archive.html">Archive</a>
  </div>
</nav>
    

    <h1>Design</h1>

    <div class="work-grid">
      <div class="work-item">
        <img src="027.jpg" alt="Poster one" class="work-image">
        <p>027: Sept 9 2026</p>
      </div>

      <div class="work-item">
        <img src="030.jpg" alt="Poster two" class="work-image">
        <p>030: Sept 21 2026</p>
      </div>

      <div class="work-item">
        <img src="029.jpg" alt="Poster three" class="work-image">
        <p> 029 sept 12</p>
      </div>

      <div class="work-item">
        <img src="026.jpg" alt="Poster four" class="work-image">
        <p>026 Sept 07</p>
      </div>
    </div>

    <script>
      const images = document.querySelectorAll('.work-image');

      images.forEach(img => {
        img.addEventListener('click', () => {
          img.classList.remove('glitching');
          void img.offsetWidth;
          img.classList.add('glitching');
        });
      });
    </script>
  </body>
</html>
